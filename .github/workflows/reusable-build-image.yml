name: Reusable Docker Build & Push Workflow
on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker image name"
        required: true
        type: string
      version-file:
        description: "Path to version file"
        required: false
        default: "./package.json"
        type: string
      docker-target:
        description: "Docker build target"
        required: false
        default: "flask-runner-prod"
        type: string
      node-version:
        description: "Node.js version for version check"
        required: false
        default: "14"
        type: string
      platforms:
        description: "Docker platforms to build for"
        required: false
        default: "linux/amd64"
        type: string
    secrets:
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      DOCKER_HUB_USERNAME:
        required: true
      SUPPORT_URL:
        required: false

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for version check
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: "npm"

      - name: Check if version is bumped
        id: version-check
        uses: EndBug/version-check@v2
        with:
          diff-search: true
          file-name: ${{ inputs.version-file }}

      - name: Setup up QEMU
        if: steps.version-check.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version-check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: steps.version-check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          path: /tmp/.buildx-cache
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        if: steps.version-check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}

      - name: Build and push Docker image
        if: steps.version-check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SUPPORT_URL=${{ secrets.SUPPORT_URL }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.image-name }}:${{ steps.version-check.outputs.version }}
            ${{ inputs.image-name }}:latest
          target: ${{ inputs.docker-target }}

      - name: Move cache
        if: steps.version-check.outputs.changed == 'true'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build summary
        if: steps.version-check.outputs.changed == 'true'
        run: |
          echo "Successfully built and pushed Docker image"
          echo "Image: ${{ inputs.image-name }}:${{ steps.version-check.outputs.version }}"
          echo "Tags: ${{ inputs.image-name }}:${{ steps.version-check.outputs.version }}, ${{ inputs.image-name }}:latest"

    outputs:
      image-tag: ${{ steps.version-check.outputs.version }}
      image-name: ${{ inputs.image-name }}
      version-changed: ${{ steps.version-check.outputs.changed }}

